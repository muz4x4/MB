<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BTC Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
  :root{ --bg:#000; --panel:#050505; --line:#1A1A1A; --ink:#FFD400; --ink-dim:#5A5A5A; --amber:#2DA6FF; --up:#39FF14; --down:#FF1E3C; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); color:var(--ink); overflow:hidden; font-family:'Space Grotesk',sans-serif; }
  #app{ height:100vh; width:100vw; padding: max(8px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(32px, env(safe-area-inset-left)); display:flex; flex-direction:column; gap:8px; }
  header{ display:flex; justify-content:flex-end; align-items:center; flex-shrink:0; }
  .clock{ font-family:'Roboto Mono',monospace; font-size:14px; color:var(--ink-dim); display:flex; align-items:center; gap:16px; }
  .gear{ display:flex;align-items:center;justify-content:center; color:var(--ink-dim); cursor:pointer; font-size:34px; flex-shrink:0; padding:10px; }
  .hero{ background:transparent; border:none; padding:0; flex:1; display:flex; flex-direction:column; min-height:0; }
  .price-row{ display:flex; align-items:baseline; justify-content:space-between; gap:20px; flex-wrap:nowrap; min-width:0; flex-shrink:0; }
  .ticker-badge{ font-family:'Roboto Mono',monospace; font-weight:700; letter-spacing:.02em; color:var(--amber); font-size:clamp(32px,9vw,100px); line-height:1; white-space:nowrap; flex-shrink:0; }
  .hero-price{ font-family:'Roboto Mono',monospace; font-size:clamp(32px,9vw,100px); color:var(--ink); white-space:nowrap; min-width:0; text-align:right; }
  .change-row{ display:flex; justify-content:flex-end; flex-shrink:0; }
  .hero-change{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:clamp(16px,2.6vw,28px); margin-top:4px; }
  .hero-change.up{ color:var(--up); }
  .hero-change.down{ color:var(--down); }
  .hero-sub{ margin-top:10px; font-size:13px; color:var(--ink-dim); font-family:'Roboto Mono',monospace; flex-shrink:0; }
  .spark-wrap{ margin-top:14px; margin-bottom:34px; flex:1; min-height:0; position:relative; }
  .spark-wrap svg{ width:100%; height:100%; overflow:visible; position:relative; z-index:1; }
  .spark-label{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:clamp(16px,2.2vw,24px); color:var(--amber); letter-spacing:.08em; margin-top:10px; flex-shrink:0; }
  .xaxis-wrap{ position:relative; height:20px; margin-top:6px; flex-shrink:0; }
  .xaxis-tick{ position:absolute; top:0; font-family:'Roboto Mono',monospace; font-size:12px; color:var(--ink-dim); white-space:nowrap; }

  .spark-callout{
    position:absolute; z-index:3;
    background:#141414; border:1px solid #555555; border-radius:6px;
    padding:5px 12px; font-family:'Roboto Mono',monospace; font-weight:600; font-size:clamp(15px,1.8vw,20px); color:#F2F2F2;
    white-space:nowrap; pointer-events:none; display:none;
  }
  .spark-callout.show{ display:block; }
  .spark-callout.below{ transform:translate(-50%,10px); }
  .spark-callout.below::before{ content:""; position:absolute; top:-9px; left:var(--arrow-left,50%); transform:translateX(-50%); border-left:9px solid transparent; border-right:9px solid transparent; border-bottom:9px solid var(--amber); }
  .spark-callout.above{ transform:translate(-50%,calc(-100% - 10px)); }
  .spark-callout.above::before{ content:""; position:absolute; bottom:-9px; left:var(--arrow-left,50%); transform:translateX(-50%); border-left:9px solid transparent; border-right:9px solid transparent; border-top:9px solid var(--amber); }
  footer{ display:flex; justify-content:space-between; font-family:'Roboto Mono',monospace; font-size:11px; color:var(--ink-dim); flex-shrink:0; }

  #app.sleep-mode:not(.peek){ background:#000; }
  #app.sleep-mode:not(.peek) > *{ visibility:hidden; }

  .backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .25s; z-index:10; }
  .backdrop.open{ opacity:1; pointer-events:auto; }
  .drawer{ position:fixed; right:0; top:0; bottom:0; width:min(420px,92vw); background:var(--panel); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .3s ease; z-index:11; padding:28px 26px; overflow-y:auto; }
  .drawer.open{ transform:translateX(0); }
  .field{ margin-bottom:22px; }
  .field label{ display:block; font-size:12px; color:var(--ink-dim); margin-bottom:8px; }
  .field .hint{ font-size:11px; color:var(--ink-dim); margin-top:6px; line-height:1.5; }
  select,input{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--ink); font-family:'Roboto Mono',monospace; font-size:14px; padding:10px 12px; }
  .row-add{ display:flex; gap:8px; align-items:center; }
  button{ font-family:'Space Grotesk',sans-serif; font-weight:600; border:none; border-radius:8px; cursor:pointer; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink-dim); width:100%; padding:12px; margin-top:8px; }
  .status-line{ font-size:10px; color:var(--ink-dim); margin-top:14px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="clock">
      <span id="clockText">--:--:--</span>
      <div class="gear" id="gearBtn">⚙</div>
    </div>
  </header>

  <div class="hero" id="hero">
    <div class="price-row">
      <div class="ticker-badge">BTC</div>
      <div class="hero-price" id="heroPrice">waiting...</div>
    </div>
    <div class="change-row"><div class="hero-change" id="heroChange"></div></div>
    <div class="hero-sub" id="heroSub"></div>
    <div class="spark-wrap">
      <svg id="sparkSvg" viewBox="0 0 600 70" preserveAspectRatio="none"></svg>
      <div class="spark-callout above" id="sparkMaxLabel"></div>
      <div class="spark-callout below" id="sparkMinLabel"></div>
    </div>
    <div class="xaxis-wrap" id="xaxisWrap"></div>
    <div class="spark-label" id="sparkLabel">24H RANGE</div>
  </div>

  <footer>
    <span id="lastUpdated">Not yet updated</span>
    <span id="buildStamp">build 2026-08-24-final</span>
  </footer>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer">
  <div class="field">
    <label>Display currency</label>
    <select id="currencySelect">
      <option value="usd">USD</option>
      <option value="aud">AUD</option>
    </select>
  </div>

  <div class="field">
    <label>Graph timeframe</label>
    <select id="rangeSelect">
      <option value="1h">1 Hour</option>
      <option value="1">24 Hours</option>
      <option value="7">7 Days</option>
      <option value="30">30 Days</option>
      <option value="365">1 Year</option>
    </select>
  </div>

  <div class="field">
    <label>Refresh interval (seconds)</label>
    <select id="intervalSelect">
      <option value="10">10</option>
      <option value="30">30</option>
      <option value="60">60</option>
    </select>
  </div>

  <div class="field">
    <label>CoinGecko Demo API key</label>
    <input type="password" id="cgKeyInput" placeholder="paste key here" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint">Optional — raises your rate limit for faster refresh.</div>
  </div>

  <div class="field">
    <label>Overnight screen-off</label>
    <div class="row-add">
      <input type="checkbox" id="sleepEnabled" style="width:20px;height:20px;flex:0 0 auto;accent-color:var(--amber);">
      <span style="font-size:13px;color:var(--ink-dim);">Enable</span>
    </div>
    <div class="row-add" style="margin-top:12px;">
      <div style="flex:1;"><div class="hint">Off at</div><input type="time" id="sleepStart"></div>
      <div style="flex:1;"><div class="hint">On at</div><input type="time" id="sleepEnd"></div>
    </div>
  </div>

  <button class="btn-ghost" id="closeDrawer">Close</button>
  <div class="status-line" id="storageStatus"></div>
</div>

<script>
const STORAGE_KEY = 'btcboard-v2-settings';
const DEFAULTS = { currency:'usd', chartRange:'1', interval:10, cgApiKey:'', sleepEnabled:false, sleepStart:'21:30', sleepEnd:'05:30' };
let settings = { ...DEFAULTS };
let priceTimer = null;
let lastSparkPoints = [];

function testStorage(){
  try{ localStorage.setItem('__t__','1'); const ok = localStorage.getItem('__t__')==='1'; localStorage.removeItem('__t__'); return ok; }
  catch(e){ return false; }
}
function loadSettings(){
  const statusEl = document.getElementById('storageStatus');
  if(!testStorage()){ statusEl.textContent = 'Storage unavailable.'; }
  else{
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) settings = { ...settings, ...JSON.parse(raw) };
      statusEl.textContent = raw ? 'Storage OK — loaded.' : 'Storage OK — defaults.';
    }catch(e){ statusEl.textContent = 'Storage read failed: ' + e.message; }
  }
  document.getElementById('currencySelect').value = settings.currency;
  document.getElementById('rangeSelect').value = settings.chartRange;
  document.getElementById('intervalSelect').value = String(settings.interval);
  document.getElementById('cgKeyInput').value = settings.cgApiKey;
  document.getElementById('sleepEnabled').checked = settings.sleepEnabled;
  document.getElementById('sleepStart').value = settings.sleepStart;
  document.getElementById('sleepEnd').value = settings.sleepEnd;
}
function saveSettings(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); }catch(e){} }

document.getElementById('gearBtn').onclick = ()=>{
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('drawer').classList.add('open');
};
function closeDrawer(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
document.getElementById('backdrop').onclick = closeDrawer;
document.getElementById('closeDrawer').onclick = closeDrawer;

document.getElementById('currencySelect').onchange = (e)=>{ settings.currency=e.target.value; saveSettings(); tick(); fetchSparkline(); };
document.getElementById('rangeSelect').onchange = (e)=>{ settings.chartRange=e.target.value; saveSettings(); fetchSparkline(); };
document.getElementById('intervalSelect').onchange = (e)=>{ settings.interval=parseInt(e.target.value,10); saveSettings(); restartPriceTimer(); };
document.getElementById('sleepEnabled').onchange = (e)=>{ settings.sleepEnabled=e.target.checked; saveSettings(); };
document.getElementById('sleepStart').onchange = (e)=>{ settings.sleepStart=e.target.value||DEFAULTS.sleepStart; saveSettings(); };
document.getElementById('sleepEnd').onchange = (e)=>{ settings.sleepEnd=e.target.value||DEFAULTS.sleepEnd; saveSettings(); };
document.getElementById('cgKeyInput').addEventListener('blur', ()=>{ settings.cgApiKey = document.getElementById('cgKeyInput').value.trim(); saveSettings(); });

function timeToMinutes(s){ const [h,m]=s.split(':').map(Number); return h*60+m; }
function isSleepNow(){
  if(!settings.sleepEnabled) return false;
  const now = new Date(); const nowMin = now.getHours()*60+now.getMinutes();
  const start = timeToMinutes(settings.sleepStart), end = timeToMinutes(settings.sleepEnd);
  if(start===end) return false;
  return start<end ? (nowMin>=start && nowMin<end) : (nowMin>=start || nowMin<end);
}
let wasAsleep = false, peekTimer = null;
function updateSleepState(){
  const app = document.getElementById('app'); const asleep = isSleepNow();
  app.classList.toggle('sleep-mode', asleep);
  if(asleep===wasAsleep) return;
  wasAsleep = asleep;
  if(asleep){ if(priceTimer) clearInterval(priceTimer); }
  else{ restartPriceTimer(); tick(); fetchSparkline(); app.classList.remove('peek'); }
}
document.getElementById('app').addEventListener('click', ()=>{
  const app = document.getElementById('app');
  if(!app.classList.contains('sleep-mode')) return;
  app.classList.add('peek'); clearTimeout(peekTimer);
  peekTimer = setTimeout(()=> app.classList.remove('peek'), 5000);
});

function tickClock(){ document.getElementById('clockText').textContent = new Date().toLocaleTimeString('en-AU',{hour12:false}); updateSleepState(); }
setInterval(tickClock, 1000);
tickClock();

function fmtMoney(n, currency){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const symbol = currency==='usd' ? '$' : 'A$';
  const decimals = n<10 ? 4 : 2;
  return symbol + n.toLocaleString('en-AU',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}

const RANGE_WINDOW_MS = { '1h':3600*1000, '1':86400*1000, '7':7*86400*1000, '30':30*86400*1000, '365':365*86400*1000 };
const MAX_POINTS = 400;

async function tick(){
  document.getElementById('heroSub').textContent = 'fetching...';
  try{
    const vs = settings.currency;
    let url = `https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=${vs}&precision=2`;
    if(settings.cgApiKey) url += `&x_cg_demo_api_key=${encodeURIComponent(settings.cgApiKey)}`;
    const res = await fetch(url);
    const data = await res.json();
    const btc = data.bitcoin;
    if(!btc || btc[vs]===undefined) throw new Error('bad response');
    document.getElementById('heroPrice').textContent = fmtMoney(btc[vs], vs);
    document.getElementById('heroSub').textContent = 'ok ' + new Date().toLocaleTimeString('en-AU',{hour12:false});

    if(lastSparkPoints.length){
      // append the live tick rather than overwrite the last point, then drop
      // anything that's aged out of the selected window — this is what makes
      // the graph appear to drift slowly leftward as time passes
      const now = Date.now();
      lastSparkPoints.push([now, btc[vs]]);
      const windowMs = RANGE_WINDOW_MS[settings.chartRange] || RANGE_WINDOW_MS['1'];
      const cutoff = now - windowMs;
      lastSparkPoints = lastSparkPoints.filter(p => p[0] >= cutoff);
      if(lastSparkPoints.length > MAX_POINTS){
        lastSparkPoints = lastSparkPoints.slice(lastSparkPoints.length - MAX_POINTS);
      }
      drawSparkline(lastSparkPoints);
    }
  }catch(e){
    document.getElementById('heroSub').textContent = 'ERROR: ' + e.message;
  }
  document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-AU',{hour12:false});
}

async function fetchSparkline(){
  try{
    let url;
    if(settings.chartRange === '1h'){
      const nowSec = Math.floor(Date.now()/1000);
      const fromSec = nowSec - 3600;
      url = `https://api.coingecko.com/api/v3/coins/bitcoin/market_chart/range?vs_currency=${settings.currency}&from=${fromSec}&to=${nowSec}&precision=2`;
    }else{
      url = `https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=${settings.currency}&days=${settings.chartRange}&precision=2`;
    }
    if(settings.cgApiKey) url += `&x_cg_demo_api_key=${encodeURIComponent(settings.cgApiKey)}`;
    const res = await fetch(url);
    const data = await res.json();
    // full refetch resyncs to ground truth, correcting any drift the
    // between-fetch live-append/prune approach introduces
    lastSparkPoints = data.prices || [];
    drawSparkline(lastSparkPoints);
  }catch(e){ console.error('sparkline failed', e); }
}

const TICK_COUNT = 5;
const DAY_MS = 24*3600*1000;
const HOUR_MS = 3600*1000;

// Every timeframe's ticks land on a meaningful calendar boundary in local
// time: 24H → exact hours, 7D → midnight each day, 30D → Monday midnights,
// 1Y → the 1st of every second month.
function buildTickTimestamps(tMin, tMax, chartRange){
  const targets = [];
  if(chartRange === '1h'){
    const TEN_MIN = 10*60*1000;
    let t = Math.ceil(tMin/TEN_MIN)*TEN_MIN;
    while(t <= tMax){ targets.push(t); t += TEN_MIN; }
  }else if(chartRange === '1'){
    const step = 6*HOUR_MS; // 6-hour spacing gives ~5 ticks across 24h
    let t = Math.ceil(tMin/HOUR_MS)*HOUR_MS;
    while(t <= tMax){ targets.push(t); t += step; }
  }else if(chartRange === '7'){
    let d = new Date(tMin); d.setHours(0,0,0,0);
    let t = d.getTime();
    if(t < tMin) t += DAY_MS;
    while(t <= tMax){ targets.push(t); t += DAY_MS; }
  }else if(chartRange === '30'){
    let d = new Date(tMin); d.setHours(0,0,0,0);
    const day = d.getDay(); // 0=Sun,1=Mon,...6=Sat
    const daysUntilMonday = (8 - day) % 7;
    d.setDate(d.getDate() + daysUntilMonday);
    let t = d.getTime();
    while(t <= tMax){ targets.push(t); t += 7*DAY_MS; }
  }else{
    let d = new Date(tMin); d.setDate(1); d.setHours(0,0,0,0);
    if(d.getTime() < tMin) d.setMonth(d.getMonth()+1);
    let t = d.getTime();
    while(t <= tMax){
      targets.push(t);
      const nd = new Date(t); nd.setMonth(nd.getMonth()+2); nd.setDate(1); nd.setHours(0,0,0,0);
      t = nd.getTime();
    }
  }
  if(targets.length === 0) targets.push(tMax);
  return targets;
}

function getTickIndices(points, chartRange){
  const tMin = points[0][0], tMax = points[points.length-1][0];
  const targets = buildTickTimestamps(tMin, tMax, chartRange);
  const idxSet = new Set();
  targets.forEach(target=>{
    let bestIdx = 0, bestDiff = Infinity;
    points.forEach((p,i)=>{ const diff = Math.abs(p[0]-target); if(diff < bestDiff){ bestDiff = diff; bestIdx = i; } });
    idxSet.add(bestIdx);
  });
  return Array.from(idxSet).sort((a,b)=>a-b);
}

function positionCallout(el, xPct, yPct, side){
  // side: 'above' (high marker) or 'below' (low marker)
  el.classList.remove('above','below');
  el.classList.add(side);
  el.style.left = xPct + '%';
  el.style.top = yPct + '%';
  // start centered; corrected precisely below once the element has real dimensions
  el.style.transform = `translate(-50%, ${side === 'below' ? '10px' : 'calc(-100% - 10px)'})`;
  el.style.setProperty('--arrow-left', '50%');

  requestAnimationFrame(()=>{
    const container = el.parentElement;
    if(!container) return;
    const containerRect = container.getBoundingClientRect();
    const targetX = containerRect.left + (xPct/100) * containerRect.width; // exact pixel position of the data point
    const bubbleWidth = el.getBoundingClientRect().width;
    const margin = 6;
    let bubbleLeft = targetX - bubbleWidth/2; // default: centered on the point
    const minLeft = containerRect.left + margin;
    const maxLeft = containerRect.left + containerRect.width - bubbleWidth - margin;
    if(bubbleLeft < minLeft) bubbleLeft = minLeft;
    if(bubbleLeft > maxLeft) bubbleLeft = maxLeft;

    const leftPx = bubbleLeft - containerRect.left;
    el.style.left = leftPx + 'px';
    el.style.transform = `translate(0, ${side === 'below' ? '10px' : 'calc(-100% - 10px)'})`;

    // arrow sits at the true point's position within the bubble, clamped
    // so it never renders outside the bubble's rounded corners
    let arrowOffset = targetX - bubbleLeft;
    const arrowMin = 12, arrowMax = bubbleWidth - 12;
    if(arrowOffset < arrowMin) arrowOffset = arrowMin;
    if(arrowOffset > arrowMax) arrowOffset = arrowMax;
    el.style.setProperty('--arrow-left', arrowOffset + 'px');
  });
}

function drawSparkline(points){
  const svg = document.getElementById('sparkSvg');
  const maxLabel = document.getElementById('sparkMaxLabel');
  const minLabel = document.getElementById('sparkMinLabel');
  if(!points || points.length < 2){
    svg.innerHTML='';
    maxLabel.classList.remove('show');
    minLabel.classList.remove('show');
    return;
  }
  const prices = points.map(p=>p[1]);
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = (max-min) || 1;
  const W=600,H=70,PAD=4;
  const coords = points.map((p,i)=>{
    const x = (i/(points.length-1))*W;
    const y = H-PAD-((p[1]-min)/range)*(H-PAD*2);
    return [x,y];
  });
  const linePath = coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${W},${H} L0,${H} Z`;
  const up = prices[prices.length-1] >= prices[0];
  const stroke = up ? 'var(--up)' : 'var(--down)';

  let maxIdx = 0, minIdx = 0;
  prices.forEach((p,i)=>{ if(p > prices[maxIdx]) maxIdx = i; if(p < prices[minIdx]) minIdx = i; });

  // grid lines rising from each x-axis tick position up to the price line
  // itself (not above it), so it's obvious exactly where each time label
  // lines up on the graph
  const tickIndices = getTickIndices(points, settings.chartRange);
  const gridLines = tickIndices.map(idx=>{
    const x = coords[idx][0].toFixed(1);
    const yTop = coords[idx][1].toFixed(1);
    return `<line x1="${x}" y1="${yTop}" x2="${x}" y2="${H}" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>`;
  }).join('');

  svg.innerHTML = `
    <defs><linearGradient id="sf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${up?'#39FF14':'#FF1E3C'}" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="${up?'#39FF14':'#FF1E3C'}" stop-opacity="0"/>
    </linearGradient></defs>
    ${gridLines}
    <path d="${areaPath}" fill="url(#sf)" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="${stroke}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
  `;

  maxLabel.textContent = fmtMoney(max, settings.currency);
  positionCallout(maxLabel, (coords[maxIdx][0]/W)*100, (coords[maxIdx][1]/H)*100, 'above');
  maxLabel.classList.add('show');

  minLabel.textContent = fmtMoney(min, settings.currency);
  positionCallout(minLabel, (coords[minIdx][0]/W)*100, (coords[minIdx][1]/H)*100, 'below');
  minLabel.classList.add('show');

  const rangeLabels = {'1h':'1H','1':'24H','7':'7D','30':'30D','365':'1Y'};
  document.getElementById('sparkLabel').textContent = `${rangeLabels[settings.chartRange]||'24H'}  ·  LOW ${fmtMoney(min,settings.currency)}  ·  HIGH ${fmtMoney(max,settings.currency)}`;

  const changePct = ((prices[prices.length-1] - prices[0]) / prices[0]) * 100;
  const changeEl = document.getElementById('heroChange');
  changeEl.textContent = (changePct>=0 ? '▲ ' : '▼ ') + Math.abs(changePct).toFixed(2) + '%';
  changeEl.className = 'hero-change ' + (changePct>=0 ? 'up' : 'down');

  drawXAxis(points, tickIndices);
}

function formatXAxisTick(ts, chartRange){
  const d = new Date(ts);
  if(chartRange === '1h' || chartRange === '1'){
    return d.toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit', hour12:false });
  }else if(chartRange === '7'){
    return d.toLocaleDateString('en-AU', { weekday:'short' });
  }else if(chartRange === '30'){
    const wd = d.toLocaleDateString('en-AU', { weekday:'short' });
    const mon = d.toLocaleDateString('en-AU', { month:'short' });
    return `${wd} ${d.getDate()} ${mon}`;
  }else{
    return d.toLocaleDateString('en-AU', { month:'short' });
  }
}

function drawXAxis(points, tickIndices){
  const wrap = document.getElementById('xaxisWrap');
  wrap.innerHTML = '';
  if(!points || points.length < 2) return;
  tickIndices.forEach((idx)=>{
    const pct = (idx/(points.length-1)) * 100;
    const span = document.createElement('span');
    span.className = 'xaxis-tick';
    span.textContent = formatXAxisTick(points[idx][0], settings.chartRange);
    // edge-anchor near the very ends so a label never gets clipped off-screen,
    // otherwise centre it on its exact calendar-aligned position
    if(pct < 4){
      span.style.left = '0%';
    }else if(pct > 96){
      span.style.right = '0%';
    }else{
      span.style.left = pct + '%';
      span.style.transform = 'translateX(-50%)';
    }
    wrap.appendChild(span);
  });
}

function restartPriceTimer(){
  if(priceTimer) clearInterval(priceTimer);
  priceTimer = setInterval(tick, settings.interval*1000);
}

let wakeLock = null;
async function requestWakeLock(){
  try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }
  catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') requestWakeLock(); });
requestWakeLock();

loadSettings();
restartPriceTimer();
tick();
fetchSparkline();
</script>
