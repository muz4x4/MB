<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BTC Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
  :root{ --bg:#000; --panel:#050505; --line:#1A1A1A; --ink:#FFD400; --ink-dim:#5A5A5A; --amber:#2DA6FF; --up:#39FF14; --down:#FF1E3C; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); color:var(--ink); overflow:hidden; font-family:'Space Grotesk',sans-serif; }
  #app{ height:100vh; width:100vw; padding:28px 32px; display:flex; flex-direction:column; gap:16px; }
  header{ display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
  .brand h1{ font-size:15px; letter-spacing:.28em; font-weight:600; color:var(--ink-dim); text-transform:uppercase; }
  .clock{ font-family:'Roboto Mono',monospace; font-size:14px; color:var(--ink-dim); display:flex; align-items:center; gap:14px; }
  .gear{ width:34px;height:34px; border-radius:50%; border:1px solid var(--line); display:flex;align-items:center;justify-content:center; color:var(--ink-dim); cursor:pointer; }
  .hero{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px 30px; flex:1; display:flex; flex-direction:column; min-height:0; }
  .ticker-badge{ font-family:'Roboto Mono',monospace; font-weight:700; letter-spacing:.04em; color:var(--amber); font-size:clamp(32px,5.5vw,64px); line-height:1; margin-bottom:8px; flex-shrink:0; }
  .hero-price{ font-family:'Roboto Mono',monospace; font-size:clamp(40px,9vw,100px); color:var(--ink); white-space:nowrap; flex-shrink:0; }
  .hero-sub{ margin-top:10px; font-size:13px; color:var(--ink-dim); font-family:'Roboto Mono',monospace; flex-shrink:0; }
  .spark-wrap{ margin-top:20px; flex:1; min-height:0; position:relative; }
  .spark-wrap svg{ width:100%; height:100%; overflow:visible; position:relative; z-index:1; }
  .spark-label{ font-family:'Roboto Mono',monospace; font-weight:700; font-size:clamp(16px,2.2vw,24px); color:var(--amber); letter-spacing:.08em; margin-top:10px; flex-shrink:0; }

  .spark-callout{
    position:absolute; z-index:3;
    background:#FFFFFF; border:1px solid #FFFFFF; border-radius:6px;
    padding:5px 12px; font-family:'Roboto Mono',monospace; font-weight:700; font-size:clamp(15px,1.8vw,20px); color:#000000;
    white-space:nowrap; pointer-events:none; display:none;
  }
  .spark-callout.show{ display:block; }
  .spark-callout.below{ transform:translate(-50%,10px); }
  .spark-callout.below::before{ content:""; position:absolute; top:-5px; left:50%; transform:translateX(-50%); border-left:5px solid transparent; border-right:5px solid transparent; border-bottom:5px solid #FFFFFF; }
  .spark-callout.above{ transform:translate(-50%,calc(-100% - 10px)); }
  .spark-callout.above::before{ content:""; position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); border-left:5px solid transparent; border-right:5px solid transparent; border-top:5px solid #FFFFFF; }
  footer{ display:flex; justify-content:space-between; font-family:'Roboto Mono',monospace; font-size:11px; color:var(--ink-dim); flex-shrink:0; }

  #app.sleep-mode:not(.peek){ background:#000; }
  #app.sleep-mode:not(.peek) > *{ visibility:hidden; }

  .backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .25s; z-index:10; }
  .backdrop.open{ opacity:1; pointer-events:auto; }
  .drawer{ position:fixed; right:0; top:0; bottom:0; width:min(420px,92vw); background:var(--panel); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .3s ease; z-index:11; padding:28px 26px; overflow-y:auto; }
  .drawer.open{ transform:translateX(0); }
  .field{ margin-bottom:22px; }
  .field label{ display:block; font-size:12px; color:var(--ink-dim); margin-bottom:8px; }
  .field .hint{ font-size:11px; color:var(--ink-dim); margin-top:6px; line-height:1.5; }
  select,input{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--ink); font-family:'Roboto Mono',monospace; font-size:14px; padding:10px 12px; }
  .row-add{ display:flex; gap:8px; align-items:center; }
  button{ font-family:'Space Grotesk',sans-serif; font-weight:600; border:none; border-radius:8px; cursor:pointer; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink-dim); width:100%; padding:12px; margin-top:8px; }
  .status-line{ font-size:10px; color:var(--ink-dim); margin-top:14px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand"><h1>BTC Board</h1></div>
    <div class="clock">
      <span id="clockText">--:--:--</span>
      <div class="gear" id="gearBtn">⚙</div>
    </div>
  </header>

  <div class="hero" id="hero">
    <div class="ticker-badge">BTC</div>
    <div class="hero-price" id="heroPrice">waiting...</div>
    <div class="hero-sub" id="heroSub"></div>
    <div class="spark-wrap">
      <svg id="sparkSvg" viewBox="0 0 600 70" preserveAspectRatio="none"></svg>
      <div class="spark-callout below" id="sparkMaxLabel"></div>
      <div class="spark-callout above" id="sparkMinLabel"></div>
    </div>
    <div class="spark-label" id="sparkLabel">24H RANGE</div>
  </div>

  <footer>
    <span id="lastUpdated">Not yet updated</span>
    <span id="buildStamp">build 2026-08-24-final</span>
  </footer>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer">
  <div class="field">
    <label>Display currency</label>
    <select id="currencySelect">
      <option value="usd">USD</option>
      <option value="aud">AUD</option>
    </select>
  </div>

  <div class="field">
    <label>Graph timeframe</label>
    <select id="rangeSelect">
      <option value="1">24 Hours</option>
      <option value="7">7 Days</option>
      <option value="30">30 Days</option>
      <option value="365">1 Year</option>
    </select>
  </div>

  <div class="field">
    <label>Refresh interval (seconds)</label>
    <select id="intervalSelect">
      <option value="1">1</option>
      <option value="3">3</option>
      <option value="5">5</option>
      <option value="10">10</option>
      <option value="30">30</option>
      <option value="60">60</option>
    </select>
  </div>

  <div class="field">
    <label>CoinGecko Demo API key</label>
    <input type="password" id="cgKeyInput" placeholder="paste key here" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint">Optional — raises your rate limit for faster refresh.</div>
  </div>

  <div class="field">
    <label>Overnight screen-off</label>
    <div class="row-add">
      <input type="checkbox" id="sleepEnabled" style="width:20px;height:20px;flex:0 0 auto;accent-color:var(--amber);">
      <span style="font-size:13px;color:var(--ink-dim);">Enable</span>
    </div>
    <div class="row-add" style="margin-top:12px;">
      <div style="flex:1;"><div class="hint">Off at</div><input type="time" id="sleepStart"></div>
      <div style="flex:1;"><div class="hint">On at</div><input type="time" id="sleepEnd"></div>
    </div>
  </div>

  <button class="btn-ghost" id="closeDrawer">Close</button>
  <div class="status-line" id="storageStatus"></div>
</div>

<script>
const STORAGE_KEY = 'btcboard-v2-settings';
const DEFAULTS = { currency:'usd', chartRange:'1', interval:5, cgApiKey:'', sleepEnabled:false, sleepStart:'21:30', sleepEnd:'05:30' };
let settings = { ...DEFAULTS };
let priceTimer = null;
let lastSparkPoints = [];

function testStorage(){
  try{ localStorage.setItem('__t__','1'); const ok = localStorage.getItem('__t__')==='1'; localStorage.removeItem('__t__'); return ok; }
  catch(e){ return false; }
}
function loadSettings(){
  const statusEl = document.getElementById('storageStatus');
  if(!testStorage()){ statusEl.textContent = 'Storage unavailable.'; }
  else{
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) settings = { ...settings, ...JSON.parse(raw) };
      statusEl.textContent = raw ? 'Storage OK — loaded.' : 'Storage OK — defaults.';
    }catch(e){ statusEl.textContent = 'Storage read failed: ' + e.message; }
  }
  document.getElementById('currencySelect').value = settings.currency;
  document.getElementById('rangeSelect').value = settings.chartRange;
  document.getElementById('intervalSelect').value = String(settings.interval);
  document.getElementById('cgKeyInput').value = settings.cgApiKey;
  document.getElementById('sleepEnabled').checked = settings.sleepEnabled;
  document.getElementById('sleepStart').value = settings.sleepStart;
  document.getElementById('sleepEnd').value = settings.sleepEnd;
}
function saveSettings(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); }catch(e){} }

document.getElementById('gearBtn').onclick = ()=>{
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('drawer').classList.add('open');
};
function closeDrawer(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
document.getElementById('backdrop').onclick = closeDrawer;
document.getElementById('closeDrawer').onclick = closeDrawer;

document.getElementById('currencySelect').onchange = (e)=>{ settings.currency=e.target.value; saveSettings(); tick(); fetchSparkline(); };
document.getElementById('rangeSelect').onchange = (e)=>{ settings.chartRange=e.target.value; saveSettings(); fetchSparkline(); };
document.getElementById('intervalSelect').onchange = (e)=>{ settings.interval=parseInt(e.target.value,10); saveSettings(); restartPriceTimer(); };
document.getElementById('sleepEnabled').onchange = (e)=>{ settings.sleepEnabled=e.target.checked; saveSettings(); };
document.getElementById('sleepStart').onchange = (e)=>{ settings.sleepStart=e.target.value||DEFAULTS.sleepStart; saveSettings(); };
document.getElementById('sleepEnd').onchange = (e)=>{ settings.sleepEnd=e.target.value||DEFAULTS.sleepEnd; saveSettings(); };
document.getElementById('cgKeyInput').addEventListener('blur', ()=>{ settings.cgApiKey = document.getElementById('cgKeyInput').value.trim(); saveSettings(); });

function timeToMinutes(s){ const [h,m]=s.split(':').map(Number); return h*60+m; }
function isSleepNow(){
  if(!settings.sleepEnabled) return false;
  const now = new Date(); const nowMin = now.getHours()*60+now.getMinutes();
  const start = timeToMinutes(settings.sleepStart), end = timeToMinutes(settings.sleepEnd);
  if(start===end) return false;
  return start<end ? (nowMin>=start && nowMin<end) : (nowMin>=start || nowMin<end);
}
let wasAsleep = false, peekTimer = null;
function updateSleepState(){
  const app = document.getElementById('app'); const asleep = isSleepNow();
  app.classList.toggle('sleep-mode', asleep);
  if(asleep===wasAsleep) return;
  wasAsleep = asleep;
  if(asleep){ if(priceTimer) clearInterval(priceTimer); }
  else{ restartPriceTimer(); tick(); fetchSparkline(); app.classList.remove('peek'); }
}
document.getElementById('app').addEventListener('click', ()=>{
  const app = document.getElementById('app');
  if(!app.classList.contains('sleep-mode')) return;
  app.classList.add('peek'); clearTimeout(peekTimer);
  peekTimer = setTimeout(()=> app.classList.remove('peek'), 5000);
});

function tickClock(){ document.getElementById('clockText').textContent = new Date().toLocaleTimeString('en-AU',{hour12:false}); updateSleepState(); }
setInterval(tickClock, 1000);
tickClock();

function fmtMoney(n, currency){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const symbol = currency==='usd' ? '$' : 'A$';
  const decimals = n<10 ? 4 : 2;
  return symbol + n.toLocaleString('en-AU',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}

async function tick(){
  document.getElementById('heroSub').textContent = 'fetching...';
  try{
    const vs = settings.currency;
    let url = `https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=${vs}&precision=2`;
    if(settings.cgApiKey) url += `&x_cg_demo_api_key=${encodeURIComponent(settings.cgApiKey)}`;
    const res = await fetch(url);
    const data = await res.json();
    const btc = data.bitcoin;
    if(!btc || btc[vs]===undefined) throw new Error('bad response');
    document.getElementById('heroPrice').textContent = fmtMoney(btc[vs], vs);
    document.getElementById('heroSub').textContent = 'ok ' + new Date().toLocaleTimeString('en-AU',{hour12:false});

    if(lastSparkPoints.length){
      lastSparkPoints[lastSparkPoints.length-1] = [Date.now(), btc[vs]];
      drawSparkline(lastSparkPoints);
    }
  }catch(e){
    document.getElementById('heroSub').textContent = 'ERROR: ' + e.message;
  }
  document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-AU',{hour12:false});
}

async function fetchSparkline(){
  try{
    let url = `https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=${settings.currency}&days=${settings.chartRange}`;
    if(settings.cgApiKey) url += `&x_cg_demo_api_key=${encodeURIComponent(settings.cgApiKey)}`;
    const res = await fetch(url);
    const data = await res.json();
    lastSparkPoints = data.prices || [];
    drawSparkline(lastSparkPoints);
  }catch(e){ console.error('sparkline failed', e); }
}

function drawSparkline(points){
  const svg = document.getElementById('sparkSvg');
  const maxLabel = document.getElementById('sparkMaxLabel');
  const minLabel = document.getElementById('sparkMinLabel');
  if(!points || points.length < 2){
    svg.innerHTML='';
    maxLabel.classList.remove('show');
    minLabel.classList.remove('show');
    return;
  }
  const prices = points.map(p=>p[1]);
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = (max-min) || 1;
  const W=600,H=70,PAD=4;
  const coords = points.map((p,i)=>{
    const x = (i/(points.length-1))*W;
    const y = H-PAD-((p[1]-min)/range)*(H-PAD*2);
    return [x,y];
  });
  const linePath = coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${W},${H} L0,${H} Z`;
  const up = prices[prices.length-1] >= prices[0];
  const stroke = up ? 'var(--up)' : 'var(--down)';

  let maxIdx = 0, minIdx = 0;
  prices.forEach((p,i)=>{ if(p > prices[maxIdx]) maxIdx = i; if(p < prices[minIdx]) minIdx = i; });

  svg.innerHTML = `
    <defs><linearGradient id="sf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${up?'#39FF14':'#FF1E3C'}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${up?'#39FF14':'#FF1E3C'}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#sf)" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="${stroke}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${coords[maxIdx][0].toFixed(1)}" cy="${coords[maxIdx][1].toFixed(1)}" r="4" fill="#39FF14" stroke="#050505" stroke-width="1.5"/>
    <circle cx="${coords[minIdx][0].toFixed(1)}" cy="${coords[minIdx][1].toFixed(1)}" r="4" fill="#FF1E3C" stroke="#050505" stroke-width="1.5"/>
  `;

  maxLabel.textContent = fmtMoney(max, settings.currency);
  maxLabel.style.left = ((coords[maxIdx][0]/W)*100) + '%';
  maxLabel.style.top = ((coords[maxIdx][1]/H)*100) + '%';
  maxLabel.classList.add('show');

  minLabel.textContent = fmtMoney(min, settings.currency);
  minLabel.style.left = ((coords[minIdx][0]/W)*100) + '%';
  minLabel.style.top = ((coords[minIdx][1]/H)*100) + '%';
  minLabel.classList.add('show');

  const rangeLabels = {'1':'24H','7':'7D','30':'30D','365':'1Y'};
  document.getElementById('sparkLabel').textContent = `${rangeLabels[settings.chartRange]||'24H'}  ·  LOW ${fmtMoney(min,settings.currency)}  ·  HIGH ${fmtMoney(max,settings.currency)}`;
}

function restartPriceTimer(){
  if(priceTimer) clearInterval(priceTimer);
  priceTimer = setInterval(tick, settings.interval*1000);
}

let wakeLock = null;
async function requestWakeLock(){
  try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }
  catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') requestWakeLock(); });
requestWakeLock();

loadSettings();
restartPriceTimer();
tick();
fetchSparkline();
</script>
</body>
</html>
